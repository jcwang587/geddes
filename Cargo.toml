[package]
name = "geddes"
version = "1.2.0"
edition = "2021"
description = "A Rust library for parsing XRD pattern files"
license = "MIT"
repository = "https://github.com/jcwang587/geddes"
documentation = "https://jcwang587.github.io/geddes/"
readme = "README.md"
keywords = ["python", "rust", "parser", "reader", "xrd"]
categories = ["science", "parsing"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
pyo3 = { version = "0.30.1", optional = true, features = ["extension-module", "abi3-py311"] }
quick-xml = "0.42.0"

[features]
default = []
python = ["pyo3"]

[dev-dependencies]
serde_json = "1"
