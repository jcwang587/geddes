repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        # Preserve imported bytes and their recorded provenance hashes.
        exclude: ^tests/data/formats/(real|licenses)/
      - id: trailing-whitespace
        exclude: ^tests/data/formats/(real|licenses)/
