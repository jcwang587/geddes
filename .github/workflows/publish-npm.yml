name: publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publishToNPM:
        description: "Publish to npm?"
        required: true
        default: "no"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check-node.yml

  publish:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' || inputs.publishToNPM == 'yes'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.10.0
      - uses: actions/download-artifact@v8
        with:
          name: node-packages
          path: node/packages
      - name: Publish the tested tarballs
        working-directory: node
        run: npm run publish:packages -- packages
