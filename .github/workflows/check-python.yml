name: check Python packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    name: Package version agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check package and tag versions
        run: python tests/check_release_version.py

  wheels:
    name: Wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: version
    env:
      # The wheels are abi3: each platform builds one wheel with the oldest
      # supported Python and tests it with the oldest and the newest.
      OLDEST_PYTHON: "3.11"
      NEWEST_PYTHON: "3.15"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python ${{ env.OLDEST_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.OLDEST_PYTHON }}
      - name: Build manylinux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist -i python${{ env.OLDEST_PYTHON }}
          manylinux: auto
      - name: Build wheel
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist -i python
      - name: Install and test the built wheel with Python ${{ env.OLDEST_PYTHON }}
        run: python tests/check_python_package.py --dist-dir dist --kind wheel
      - name: Set up Python ${{ env.NEWEST_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.NEWEST_PYTHON }}
      - name: Install and test the built wheel with Python ${{ env.NEWEST_PYTHON }}
        run: python tests/check_python_package.py --dist-dir dist --kind wheel
      - name: Upload checked wheel
        uses: actions/upload-artifact@v7
        with:
          name: checked-python-wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution / Python 3.12
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Build, install, and test the source distribution
        run: python tests/check_python_package.py --dist-dir dist --kind sdist
      - name: Upload checked source distribution
        uses: actions/upload-artifact@v7
        with:
          name: checked-python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
