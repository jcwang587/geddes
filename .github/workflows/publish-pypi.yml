name: publish pypi
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publishToPyPI:
        description: 'Publish to PyPI?'
        required: true
        default: 'no'
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/check-python.yml
  publish:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' || inputs.publishToPyPI == 'yes'
    environment:
      name: pypi
      url: https://pypi.org/project/geddes/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@v8
        with:
          pattern: checked-python-*
          path: dist
          merge-multiple: true
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
